<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2b519" />
      <stop offset="50%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e0e0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark: Orbital Tech Emblem -->
  <g transform="translate(10, 8)">
    <!-- Outer Orbit Ring -->
    <ellipse cx="32" cy="32" rx="28" ry="12" fill="none" stroke="url(#orbitGrad)" stroke-width="3.5" transform="rotate(-30 32 32)" stroke-dasharray="120 20" />
    <!-- Inner Orbit Ring -->
    <ellipse cx="32" cy="32" rx="28" ry="12" fill="none" stroke="#00e5ff" stroke-width="2" transform="rotate(40 32 32)" opacity="0.8" stroke-dasharray="90 15" />
    <!-- Core Sphere -->
    <circle cx="32" cy="32" r="11" fill="url(#orbitGrad)" filter="url(#glow)" />
    <circle cx="32" cy="32" r="5" fill="#ffffff" />
    <!-- Quantum Nodes -->
    <circle cx="56" cy="18" r="3.5" fill="#00e5ff" filter="url(#glow)" />
    <circle cx="10" cy="46" r="3" fill="#f2b519" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(85, 48)">
    <text font-family="'Montserrat', 'Poppins', sans-serif" font-weight="900" font-size="30" fill="url(#textGrad)" letter-spacing="1">QORBIT</text>
    <text font-family="'Montserrat', 'Poppins', sans-serif" font-weight="700" font-size="30" fill="#f2b519" letter-spacing="1" x="127">TECH</text>
  </g>
  <text x="87" y="66" font-family="'Poppins', sans-serif" font-weight="500" font-size="10" fill="#00e5ff" letter-spacing="4" opacity="0.9">DIGITAL INNOVATION</text>
</svg>
