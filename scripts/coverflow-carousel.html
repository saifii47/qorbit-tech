<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Denver Publishers 3D Book Orbit Showcase Section</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    :root {
      --navy: #112d46;
      --gold: #c39854;
      --gold-2: #f4c34f;
      --cream: #fbf7ef;
      --muted: #6b7772;
      --line: rgba(7, 88, 76, 0.13);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background: var(--cream);
      color: var(--navy);
    }

    .intro-strip {
      padding: 80px 20px 0;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gold);
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 28px;
      height: 2px;
      background: currentColor;
      display: inline-block;
    }

    .intro-strip h2 {
      font-family: "Playfair Display", serif;
      font-size: 40px;
      font-weight: 700;
      line-height: 1.16;
      color: var(--navy);
      margin-bottom: 14px;
    }

    .intro-strip p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
      max-width: 660px;
      margin: 0 auto;
    }

    .showcase-section {
      padding-top: 30px;
      padding-bottom: 70px;
      background:
        linear-gradient(180deg, rgba(255, 250, 241, 0.2), rgba(255, 250, 241, 0.95)),
        var(--cream);
    }

    .showcase-shell {
      position: relative;
      padding: 0 0 10px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .book-orbit {
      position: relative;
      height: 510px;
      max-width: 1180px;
      margin: 0 auto;
      perspective: 1600px;
      cursor: grab;
      user-select: none;
      touch-action: pan-y;
      overflow: visible;
    }

    .book-orbit.is-dragging {
      cursor: grabbing;
    }

    .book-ring {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transform: translateZ(0);
    }

    .orbit-book {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 188px;
      height: 286px;
      margin-left: -94px;
      margin-top: -143px;
      transform-style: preserve-3d;
      will-change: transform, opacity, filter;
      transition: opacity 0.16s linear, filter 0.16s linear;
    }

    .book-shell {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
    }

    .book-shell::before {
      content: "";
      position: absolute;
      top: 5px;
      left: -20px;
      width: 22px;
      height: calc(100% - 10px);
      background: linear-gradient(90deg, #112d46, #235077);
      transform: rotateY(-90deg) translateZ(12px);
      transform-origin: right center;
      box-shadow: inset -5px 0 10px rgba(0, 0, 0, 0.28);
    }

    .book-shell::after {
      content: "";
      position: absolute;
      inset: 8px -12px 8px 12px;
      background: #112d46;
      transform: translateZ(-18px);
      box-shadow: 0 22px 34px rgba(3, 34, 29, 0.28);
    }

    .book-shell img {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: translateZ(18px);
      border-radius: 2px;
      box-shadow:
        0 30px 44px rgba(2, 34, 30, 0.24),
        inset 18px 0 24px rgba(0, 0, 0, 0.18);
      pointer-events: none;
    }

    .orbit-floor {
      position: absolute;
      left: 50%;
      bottom: 62px;
      width: min(86%, 900px);
      height: 86px;
      transform: translateX(-50%) rotateX(78deg);
      background: radial-gradient(ellipse at center, rgba(7, 88, 76, 0.22), rgba(7, 88, 76, 0.02) 64%, transparent 74%);
      filter: blur(4px);
      pointer-events: none;
    }

    .orbit-caption {
      display: flex;
      justify-content: center;
      gap: 22px;
      flex-wrap: wrap;
      color: var(--navy);
      font-size: 13px;
      font-weight: 800;
      margin-top: 10px;
    }

    .orbit-caption span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 9px 18px;
      box-shadow: 0 4px 12px rgba(17, 45, 70, 0.05);
    }

    .orbit-caption span i {
      font-size: 14px;
      color: var(--gold);
    }

    .cta-btn-box {
      display: flex;
      flex-direction: row;
      gap: 20px;
      justify-content: center;
      padding: 40px 10px 10px;
      flex-wrap: wrap;
    }

    .btn {
      border-radius: 999px;
      padding: 15px 32px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 54px;
      text-decoration: none;
      cursor: pointer;
      font-size: 15px;
      transition: all 0.3s ease;
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      border: 1px solid var(--gold);
      color: #17302b;
      box-shadow: 0 10px 24px rgba(235, 169, 31, 0.28);
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 32px rgba(235, 169, 31, 0.34);
    }

    .btn-outline-green {
      border: 1px solid rgba(7, 88, 76, 0.28);
      color: var(--navy);
      background: rgba(255, 255, 255, 0.65);
    }

    .btn-outline-green:hover {
      background: var(--navy);
      color: #ffffff;
      transform: translateY(-2px);
    }

    @media (max-width: 991.98px) {
      .book-orbit { height: 410px; }
      .orbit-book { width: 140px; height: 213px; margin-left: -70px; margin-top: -106px; }
      .intro-strip h2 { font-size: 34px; }
    }

    @media (max-width: 767.98px) {
      .book-orbit { height: 375px; perspective: 1200px; overflow: hidden; }
      .orbit-book { width: 126px; height: 192px; margin-left: -63px; margin-top: -96px; }
      .orbit-caption { gap: 10px; }
      .orbit-caption span { font-size: 12px; padding: 8px 12px; }
      .intro-strip h2 { font-size: 28px; }
    }

    @media (max-width: 575.98px) {
      .book-orbit { height: 335px; }
      .orbit-book { width: 108px; height: 165px; margin-left: -54px; margin-top: -82px; }
      .book-shell::before { left: -14px; width: 16px; }
    }
  </style>
</head>
<body>

  <!-- Section 3 Intro Strip -->
  <section class="section intro-strip">
    <div class="container">
      <div class="section-title text-center">
        <span class="eyebrow">Real Covers, Spinning In 3D</span>
        <h2>Books That Feel Finished Before You Touch Them</h2>
        <p>Premium cover design, cinematic depth, and motion built for authors who want their book to look ready for a global shelf.</p>
      </div>
    </div>
  </section>

  <!-- Section 4 3D Book Orbit Showcase -->
  <section class="section showcase-section" id="showcase">
    <div class="container">
      <div class="showcase-shell">
        <div class="book-orbit" id="bookOrbit" tabindex="0" aria-label="Interactive 3D circular book carousel. Drag, swipe, or use the mouse wheel to rotate.">
          <div class="orbit-floor"></div>
          <div class="book-ring" id="bookRing">
            <figure class="orbit-book"><div class="book-shell"><img src="../public/assets/images/portfolio/BIography & Memoir 3.jpg" alt="July Three In Washington"></div></figure>
            <figure class="orbit-book"><div class="book-shell"><img src="../public/assets/images/portfolio/BIography & Memoir 5.jpg" alt="What's Time"></div></figure>
            <figure class="orbit-book"><div class="book-shell"><img src="../public/assets/images/portfolio/Children 2.jpg" alt="Mommy's More Than Milk"></div></figure>
            <figure class="orbit-book"><div class="book-shell"><img src="../public/assets/images/portfolio/Romance 4.jpg" alt="Love True Story"></div></figure>
            <figure class="orbit-book"><div class="book-shell"><img src="../public/assets/images/portfolio/BIography & Memoir 5.jpg" alt="Touched"></div></figure>
            <figure class="orbit-book"><div class="book-shell"><img src="../public/assets/images/portfolio/Romance 3.jpg" alt="The Midnight Atlas"></div></figure>
            <figure class="orbit-book"><div class="book-shell"><img src="../public/assets/images/portfolio/Children 4.jpg" alt="The Quiet War"></div></figure>
            <figure class="orbit-book"><div class="book-shell"><img src="../public/assets/images/portfolio/BIography & Memoir 2.jpg" alt="Starlight Ledger"></div></figure>
            <figure class="orbit-book"><div class="book-shell"><img src="../public/assets/images/portfolio/Fantasy Sci Fi 3.jpg" alt="Master Your Path"></div></figure>
            <figure class="orbit-book"><div class="book-shell"><img src="../public/assets/images/portfolio/BIography & Memoir 1.jpg" alt="Scattered Pages"></div></figure>
            <figure class="orbit-book"><div class="book-shell"><img src="../public/assets/images/portfolio/Children 1.jpg" alt="The Future of Us"></div></figure>
            <figure class="orbit-book"><div class="book-shell"><img src="../public/assets/images/portfolio/Fantasy Sci Fi 3.jpg" alt="A Story We Kept"></div></figure>
          </div>
        </div>

        <div class="orbit-caption">
          <span><i class="bi bi-cursor"></i> Hold and drag</span>
          <span><i class="bi bi-mouse"></i> Wheel to rotate</span>
          <span><i class="bi bi-phone"></i> Swipe on mobile</span>
        </div>

        <div class="cta-btn-box">
          <a class="btn btn-gold btn-lg" href="#start">
            <span>Start Your Journey</span>
            <i class="bi bi-arrow-up-right"></i>
          </a>
          <a class="btn btn-outline-green btn-lg" href="#portfolio">
            <i class="bi bi-play-circle"></i>
            <span>View Covers</span>
          </a>
        </div>
      </div>
    </div>
  </section>

  <script>
    (function () {
      const orbit = document.getElementById("bookOrbit");
      const items = Array.from(document.querySelectorAll("#bookRing .orbit-book"));
      if (!orbit || !items.length) return;

      let radius = 420;
      let rotation = -8;
      let velocity = 0;
      let dragging = false;
      let lastX = 0;
      let lastMoveTime = 0;
      let lastFrame = performance.now();
      const autoSpeed = 0.018;
      const dragStrength = 0.22;

      const sizeOrbit = () => {
        const width = orbit.clientWidth || 900;
        if (width < 430) {
          radius = width * 0.45;
        } else if (width < 760) {
          radius = width * 0.42;
        } else {
          radius = Math.min(Math.max(width * 0.36, 320), 500);
        }
      };

      const render = () => {
        const step = 360 / items.length;
        items.forEach((item, index) => {
          const angle = rotation + index * step;
          const rad = angle * Math.PI / 180;
          const front = Math.cos(rad);
          const depth = (front + 1) / 2;
          const scale = 0.7 + depth * 0.42;
          const lift = (1 - depth) * 18;
          const brightness = 0.62 + depth * 0.48;
          const saturation = 0.88 + depth * 0.12;

          item.style.transform = `rotateY(${angle}deg) translateZ(${radius}px) translateY(${lift}px) scale(${scale})`;
          item.style.zIndex = String(Math.round(depth * 1000));
          item.style.opacity = String(0.34 + depth * 0.66);
          item.style.filter = `brightness(${brightness}) saturate(${saturation})`;
        });
      };

      const frame = (now) => {
        const dt = Math.min(now - lastFrame, 48);
        lastFrame = now;

        if (!dragging) {
          rotation += autoSpeed * dt;
          if (Math.abs(velocity) > 0.0005) {
            rotation += velocity * dt;
            velocity *= Math.pow(0.925, dt / 16.67);
          } else {
            velocity = 0;
          }
        }

        render();
        requestAnimationFrame(frame);
      };

      const stopDrag = (event) => {
        if (!dragging) return;
        dragging = false;
        orbit.classList.remove("is-dragging");
        if (event?.pointerId !== undefined && orbit.hasPointerCapture?.(event.pointerId)) {
          try { orbit.releasePointerCapture(event.pointerId); } catch(e){}
        }
      };

      orbit.addEventListener("pointerdown", (event) => {
        dragging = true;
        orbit.classList.add("is-dragging");
        lastX = event.clientX;
        lastMoveTime = performance.now();
        velocity = 0;
        try { orbit.setPointerCapture?.(event.pointerId); } catch(e){}
      });

      orbit.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        const now = performance.now();
        const dx = event.clientX - lastX;
        const dt = Math.max(now - lastMoveTime, 8);
        const delta = dx * dragStrength;
        rotation += delta;
        velocity = delta / dt;
        lastX = event.clientX;
        lastMoveTime = now;
        render();
      });

      orbit.addEventListener("pointerup", stopDrag);
      orbit.addEventListener("pointercancel", stopDrag);
      orbit.addEventListener("pointerleave", stopDrag);

      orbit.addEventListener("wheel", (event) => {
        event.preventDefault();
        const wheelDelta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
        velocity += wheelDelta * 0.00085;
        rotation += wheelDelta * 0.035;
        render();
      }, { passive: false });

      orbit.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
        event.preventDefault();
        const direction = event.key === "ArrowLeft" ? -1 : 1;
        velocity += direction * 0.07;
      });

      sizeOrbit();
      render();
      window.addEventListener("resize", () => {
        sizeOrbit();
        render();
      }, { passive: true });
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
